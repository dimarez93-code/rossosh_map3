<!-- Ползунок прозрачности -->
<div id="opacity-control">
    <label for="opacity-slider" style="margin-right: 10px; font-size: 14px; font-weight: bold; color: #333;">Прозрачность:</label>

</div>

<script>
    window.addEventListener('load', function() {
        // Используем ТОЧНЫЕ имена переменных из вашего layers.js
        var layer1 = lyr_2_modified_1;
        var layer2 = lyr_gx2338Nr062_modifiedjpg_modified_2;

        var slider = document.getElementById('opacity-slider');
        
        if (slider) {
            slider.addEventListener('input', function(e) {
                var value = e.target.valueAsNumber;
                
                // Меняем прозрачность сразу у обоих снимков
                if (layer1) { layer1.setOpacity(value); }
                if (layer2) { layer2.setOpacity(value); }
            });
        } else {
            console.log("Ползунок не найден в HTML");
        }
    });
</script>
